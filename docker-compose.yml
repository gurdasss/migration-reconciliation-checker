services: # number of services to run
  source_db: # name of the service
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: source
    ports: ["5433:5432"] # outside port 5433 maps to inside port 5432
  target_db: # name of the service
    image: postgres:16
    environment: # environment variables for the container
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: target
    ports: ["5434:5432"] # outside port 5434 maps to inside port 5432